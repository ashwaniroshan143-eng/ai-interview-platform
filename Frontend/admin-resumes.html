<!DOCTYPE html>
<html>
<head>
    <title>Admin Resume Records</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .resume-records-page{
            width:90%;
            max-width:1200px;
            margin:30px auto;
        }

        .top-bar{
            display:flex;
            gap:15px;
            flex-wrap:wrap;
            margin-bottom:20px;
        }

        .top-bar input{
            padding:12px;
            border:none;
            border-radius:10px;
            min-width:260px;
        }

        .resume-record-card{
            background:rgba(255,255,255,0.08);
            padding:22px;
            border-radius:16px;
            backdrop-filter:blur(10px);
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
            margin-bottom:20px;
        }

        .resume-record-card p{
            margin:8px 0;
            line-height:1.6;
        }

        .delete-btn{
            background:#ef4444;
            color:white;
            border:none;
            padding:10px 14px;
            border-radius:10px;
            cursor:pointer;
            margin-top:10px;
        }

        details{
            margin-top:12px;
        }

        summary{
            cursor:pointer;
            font-weight:bold;
            color:#ffd54f;
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-logo">
        <img src="images/logo.png" alt="logo">
        <h2>AI Student साथी</h2>
    </div>
    <ul>
        <li><a href="admin-dashboard.html">Dashboard</a></li>
    </ul>
</nav>

<div class="resume-records-page">
    <h2 class="text-center">Admin Resume Records</h2>
    <div class="top-bar">
        <input type="text" id="searchResume" placeholder="Search by user email">
    </div>
    <div id="resumeRecordsContainer"></div>
</div>

<script src="js/admin-resumes.js"></script>
</body>
</html>
